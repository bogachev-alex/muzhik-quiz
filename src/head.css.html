<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>мужицкий парфюмерный квиз: чем ты пахнешь по жизни?</title>
<meta name="theme-color" content="#F4F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..900;1,300..600&family=Marck+Script&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F1EA; --card: #FFFFFF; --ink: #23272A; --muted: #75726B; --rule: #E0DBCF; --logo: #8F8A7E;
  --accent: #A8471F; --accent-ink: #FFFFFF; --chip: #E8E3D7; --tile: #FFFFFF; --sel: #F6E7DD;
  --rust: #D9773F; --khaki: #C8BB97; --sand: #ECE6D6; --olive: #4E5C3A;
  --blk-rust: #D9773F; --blk-rust-ink: #1A1A1A; --blk-ink: #23272A; --blk-ink-ink: #F2EFE8;
  --blk-khaki: #C8BB97; --blk-khaki-ink: #1F1F1F; --blk-sand: #ECE6D6; --blk-sand-ink: #23272A;
  --blk-olive: #4E5C3A; --blk-olive-ink: #F2EFE8;
  --display: "Jost", Futura, "Century Gothic", sans-serif;
  --body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --script: "Marck Script", cursive;
  --hand: "Caveat", cursive;
  --mono: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) { :root[data-theme="auto"] {
  --paper: #121314; --card: #1B1C1E; --ink: #ECE8DF; --muted: #A39F95; --rule: #2E2F31; --logo: #8A877F;
  --accent: #E8925E; --accent-ink: #141414; --chip: #2A2A2A; --tile: #1E1F21; --sel: #34261E;
  --khaki: #4A4434; --sand: #24221C;
  --blk-ink: #2A2B2D; --blk-sand: #2E2A21; --blk-sand-ink: #ECE6D6;
  color-scheme: dark } }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth }
button, a, .tile, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); margin: 0; position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(56px, env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; position: relative; z-index: 1 }
h1, h2, h3 { margin: 0; text-wrap: balance }
p { margin: 0; max-width: 62ch }

/* masthead */
.mast { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 12px }
.mast .logo { font: 600 22px/1 var(--display); color: var(--logo); letter-spacing: .01em; text-decoration: none }
.mast .logo b { color: var(--accent); font-weight: 600 }
.scrapstack { display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.scrap { display: block; white-space: nowrap; padding: 3px 11px 5px; font: 400 18px/1 var(--script); color: #1A1A1A; background: var(--khaki); transform: rotate(-2deg); box-shadow: 1px 1px 0 rgba(0,0,0,.08) }
.scrap + .scrap { transform: rotate(1.5deg); background: var(--rust); margin-right: 8px }
[data-theme] .scrap { color: #1A1A1A }

/* hero */
.hero { display: flex; flex-direction: column; gap: 14px }
h1 { font: 500 clamp(30px, 7vw, 46px)/1.08 var(--display); letter-spacing: -0.01em }
.ul { position: relative; display: inline-block; font-style: normal }
.ul::after { content: ''; position: absolute; left: -2px; right: -2px; bottom: -.16em; height: .3em;
  background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 12' preserveAspectRatio='none'%3E%3Cpath d='M2 5 C 30 2, 70 8, 98 4M6 10 C 40 7, 70 11, 94 8' stroke='%23D9773F' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat center/100% 100% }
.dek { font: italic 15px/1.4 var(--body) }
.byline { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted) }
.byline b { color: var(--ink) }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 600 15px var(--display); flex: none }
.badges { display: flex; flex-wrap: wrap; gap: 6px }
.badge { font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: lowercase; padding: 7px 10px; border-radius: 999px; transform: rotate(-3deg); border: 1.5px solid var(--ink); background: var(--tile) }
.badge.b0 { background: var(--sel) } .badge.b1 { transform: rotate(2deg); background: var(--sand) } .badge.b2 { transform: rotate(-1deg) }
.intro { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; border-top: 1px solid var(--rule) }
.intro p { font-size: 18px; line-height: 1.5 }
.intro p em { color: var(--accent) }
.startmark { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 4px 0 -8px }
.smscrap { display: inline-block; font: 400 24px/1 var(--script); color: #1A1A1A; padding: 5px 16px 7px; background: var(--khaki); transform: rotate(-2deg) }
.startmark svg path { stroke: var(--ink) }

/* progress */
.progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 8px; display: flex; align-items: center; gap: 10px }
.bar { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; position: relative }
.bar i { display: block; position: relative; height: 100%; background: var(--rust); border-radius: 2px; transition: width .3s ease }
.bar i::after { content: '🔥'; position: absolute; right: -10px; top: 50%; transform: translateY(-55%); font-size: 16px }
.mono { font: 500 12px/1.5 var(--mono); letter-spacing: .06em; text-transform: lowercase; color: var(--muted) }
#count { margin-left: 10px; font-variant-numeric: tabular-nums }

/* question cards */
.qcard { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 52px }
.qtitle { position: relative; border-radius: 10px; min-height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 18px 26px; background: var(--blk-rust); color: var(--blk-rust-ink) }
.qtitle.bg-ink { background: var(--blk-ink); color: var(--blk-ink-ink) }
.qtitle.bg-khaki { background: var(--blk-khaki); color: var(--blk-khaki-ink) }
.qtitle.bg-sand { background: var(--blk-sand); color: var(--blk-sand-ink) }
.qtitle.bg-olive { background: var(--blk-olive); color: var(--blk-olive-ink) }
.qtitle .qnum { position: absolute; top: 10px; left: 14px; font: 600 13px/1 var(--display); opacity: .7; font-variant-numeric: tabular-nums }
.qtitle h3 { font: 400 clamp(24px, 6.4vw, 34px)/1.12 var(--display); max-width: 20ch }
.qtitle .qsub { font: 400 14px/1.35 var(--body); opacity: .78; margin-top: 8px }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.tile { appearance: none; border: 2px solid var(--rule); background: var(--tile); color: var(--ink); border-radius: 12px; padding: 14px 8px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font: 400 15px/1.25 var(--body); position: relative; transition: transform .12s, border-color .15s, background .15s, opacity .2s }
.tile .em { font-size: 34px; line-height: 1 }
.tile small { font: 400 12px/1.25 var(--body); color: var(--muted) }
.tile:hover { border-color: var(--ink) }
.tile:active { transform: scale(.97) }
.tile[aria-pressed="true"] { border-color: var(--rust); background: var(--sel) }
.tile[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 8px; font: 800 13px var(--body); color: var(--accent) }
.qcard.answered .tile[aria-pressed="false"] { opacity: .55 }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)) }

/* slider */
.slider { display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 0 }
.sl-out { font: 400 34px/1.3 var(--script); color: var(--accent); text-align: center; min-height: 1.3em }
.slider input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; cursor: pointer }
.slider input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 999px; background: linear-gradient(90deg, #7F9BB2, #C8BB97 50%, #4E5C3A) }
.slider input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: linear-gradient(90deg, #7F9BB2, #C8BB97 50%, #4E5C3A) }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -10px; border-radius: 50%; background: var(--tile); border: 3px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.25) }
.slider input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--tile); border: 3px solid var(--ink) }
.sl-ends { display: flex; justify-content: space-between; font: 700 15px var(--body) }
.sl-ticks { position: relative; height: 18px; font: 500 11px var(--mono); color: var(--muted); letter-spacing: .06em }
.sl-ticks span { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap }
.sl-ticks span::before { content: ""; position: absolute; left: 50%; top: -12px; width: 1px; height: 8px; background: var(--muted) }

/* buttons & panels */
.btn { appearance: none; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font: 500 16px/1 var(--display); letter-spacing: .02em; padding: 16px 22px; border-radius: 10px; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: transform .12s }
.btn:active { transform: scale(.98) }
.btn.ghost { background: var(--chip); border-color: var(--chip); color: var(--ink) }
.btn.rust { background: var(--rust); border-color: var(--rust); color: #141414 }
.btn.khaki { background: var(--khaki); border-color: var(--khaki); color: var(--ink) }
.btn:focus-visible, .tile:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 52px }
.panel h2 { font: 500 27px/1.15 var(--display); letter-spacing: -0.01em }
.locked { text-align: center; color: var(--muted); font-size: 15px; border: 2px dashed var(--rule); border-radius: 16px; padding: 22px 16px }

/* gate */
#gate { position: relative; overflow: visible; border: 1px solid var(--khaki); box-shadow: 6px 6px 0 var(--sel); padding-top: 34px; margin-top: 10px; align-items: center; text-align: center }
#gate .tape { position: absolute; top: -10px; width: 110px; height: 28px; background: rgba(200,187,151,.82); transform: rotate(-4deg); left: 18px }
#gate .tape.r { left: auto; right: 18px; transform: rotate(5deg) }
#gate h2 { font-size: 26px }
#gate .btn { border-radius: 999px; min-width: 74% }

/* loading */
.loading { align-items: center; text-align: center; padding-block: 36px; gap: 16px }
.loading p { font: italic 500 20px var(--display); color: var(--accent) }
.spin { width: 34px; height: 56px; position: relative; border: 2.5px solid var(--ink); border-radius: 6px 6px 10px 10px; background: var(--tile); margin-top: 12px }
.spin::before { content: ""; position: absolute; top: -12px; left: 8px; width: 14px; height: 10px; background: var(--ink); border-radius: 2px }
.spin i { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; border-radius: 0 0 7px 7px; background: var(--rust); animation: fill 1.4s ease-in-out infinite alternate }
@keyframes fill { from { height: 15% } to { height: 85% } }

/* result */
.yougot { font: 600 13px var(--display); letter-spacing: .14em; text-transform: lowercase; color: var(--accent); text-align: center }
.rx { background: var(--tile); border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; box-shadow: 0 6px 0 -3px var(--sand), 0 6px 0 -2px var(--rule) }
.rx-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 16px 6px; background: var(--ink); color: var(--paper) }
.rx-title { font: 500 20px/1 var(--display); white-space: nowrap; display: inline-flex; align-items: baseline; gap: 4px }
.rx-sym { font: 400 34px/1 var(--script); color: var(--rust) }
.rx-no { font: 400 11px var(--mono); opacity: .7; white-space: nowrap; font-variant-numeric: tabular-nums }
.rx-body { padding: 16px; display: flex; flex-direction: column; gap: 12px }
.rx-top { display: grid; grid-template-columns: minmax(0, 104px) minmax(0, 1fr); gap: 14px; align-items: center }
.rx-ph { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; background: var(--sand); display: grid; place-items: center }
.rx-ph svg { width: 70%; height: auto }
.rx-drug { display: flex; flex-direction: column; justify-content: center }
.rx-drug .brand { font: italic 400 14px/1.2 var(--body); margin-bottom: 6px }
.rx-drug .pname { font: 400 clamp(30px, 8.4vw, 42px)/1.05 var(--script); margin-bottom: 8px; position: relative; display: inline-block; align-self: flex-start }
.rx-arch { font: italic 400 15px/1.35 var(--body); color: var(--accent) }
.spec { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--rule) }
.spec div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); align-items: baseline }
.spec dt { font: 500 11px/1.35 var(--display); letter-spacing: .1em; text-transform: lowercase; color: var(--accent) }
.spec dd { margin: 0; font-size: 15px; line-height: 1.4; min-width: 0 }
.rx-sig { margin: 0; font-size: 15px; padding: 10px 12px; background: var(--sand); border-radius: 8px }
.rx-sig ul { margin: 6px 0 0; padding-left: 18px } .rx-sig li { margin: 3px 0 }
.rx-sig i { font-style: normal; font: 600 12px var(--display); letter-spacing: .1em; color: var(--accent) }
.rx-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; padding-top: 14px; border-top: 1px dashed var(--rule) }
.rx-stamp { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; text-align: center; font: 700 9px/1.15 var(--display); letter-spacing: .06em; text-transform: uppercase; transform: rotate(-12deg); opacity: .85; flex: none; padding: 6px }
.rx-signed { flex: 0 1 220px; display: flex; flex-direction: column; align-items: stretch }
.sigline { display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--ink); padding: 0 2px 3px }
.sigline .x { font: 400 16px/1 var(--body); color: var(--muted); padding-bottom: 3px }
.sigline .sig { font: 400 38px/1 var(--script); margin-left: auto; padding-right: 6px }
.rx-signed small { text-align: right; font: italic 11px/1.3 var(--body); color: var(--muted); margin-top: 4px }
.section-h { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: lowercase; color: var(--muted); border-bottom: 1px solid var(--rule); padding-bottom: 6px }
.reacts { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; padding-block: 6px }
.react { appearance: none; border: 0; background: none; cursor: pointer; padding: 0 }
.react .dot { width: 66px; height: 66px; border-radius: 50%; background: #F1D9C8; color: #8A3A17; display: grid; place-items: center; font: 900 13px/1 var(--display); text-transform: uppercase; box-shadow: inset 0 -4px 0 rgba(138,58,23,.14); transition: transform .15s, background .15s, color .15s; transform: rotate(-8deg) }
.react:nth-child(even) .dot { transform: rotate(6deg) }
.react:nth-child(3n) .dot { transform: rotate(-3deg) }
.react:hover .dot { transform: scale(1.08) rotate(-8deg) }
.react[aria-pressed="true"] .dot { background: var(--rust); color: #fff; transform: scale(1.12); box-shadow: 0 0 0 4px var(--sel) }
.share { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.share .btn { min-height: 56px; font-size: 15px; padding: 10px 8px }
.share .wide { grid-column: 1 / -1 }
.tagline { font: italic 400 15px/1.45 var(--body); color: var(--muted); text-align: center }
.runners { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.runner { border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; text-decoration: none; color: var(--ink); background: var(--tile) }
.runner .mono { font-size: 10px }
.runner b { font: 400 26px/1.1 var(--script) }
.runner span { font-size: 13px; color: var(--muted) }
.shop { text-align: center; font-size: 13px; color: var(--muted) }
.shop a { color: var(--accent) }
.about { margin: 8px 0 0; padding: 14px 2px 0; border-top: 1px solid var(--rule); color: var(--muted); text-align: center }
.about summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px }
.about summary::-webkit-details-marker { display: none }
.about summary::after { content: "+"; font: 400 15px/1 var(--body) }
.about[open] summary::after { content: "–" }
.about h2 { font: 500 13px/1.3 var(--display); margin: 0; letter-spacing: .02em }
.about h3 { font: 600 11.5px/1.35 var(--body); margin: 10px 0 1px }
.about p { font: 11.5px/1.5 var(--body); margin: 0 auto; max-width: 34em }
.foot { font-size: 12px; color: var(--muted); text-align: center; font-style: italic; margin: 0 auto }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(10,10,10,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40 }
.sheet { background: var(--card); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 100%; max-width: 420px; width: 100%; overflow: auto }
.sheet img { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; border-radius: 10px; background: var(--chip); max-height: 62vh }
.sheet textarea { width: 100%; min-height: 140px; font: 15px/1.4 var(--body); border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px; background: var(--tile); color: var(--ink) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center }

/* doodles + spritz */
#doodles { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; z-index: 0; overflow: hidden }
#doodles span { position: absolute; font: 700 26px/1 var(--hand); color: var(--accent); opacity: .55; white-space: nowrap }
.spritz { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 50 }
.spritz .mist { position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(217,119,63,.5) 0%, rgba(200,187,151,.35) 35%, rgba(200,187,151,0) 70%); animation: mist 1.5s ease-out forwards }
.spritz b { position: absolute; left: -12px; top: -12px; font-size: 24px; opacity: 0; animation: fling 1.6s cubic-bezier(.2,.7,.3,1) forwards }
@keyframes mist { 0% { transform: scale(.15); opacity: .95 } 100% { transform: scale(1.9); opacity: 0 } }
@keyframes fling { 0% { transform: translate(0,0) scale(.4); opacity: 0 } 12% { opacity: 1 } 70% { opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0 } }
.spritzed { animation: bottlein .9s cubic-bezier(.2,.8,.3,1.2) both }
@keyframes bottlein { 0% { transform: scale(.85); filter: blur(6px); opacity: 0 } 60% { filter: blur(0); opacity: 1 } 100% { transform: none } }

@media (max-width: 560px) { .runners { grid-template-columns: 1fr } }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } .qtitle { min-height: 112px; padding: 28px 14px 22px } .tile .em { font-size: 28px } .tile { padding: 10px 8px 9px } .react .dot { width: 58px; height: 58px; font-size: 12px } }
@media (max-width: 440px) { .mast .logo { font-size: 19px } .scrap { font-size: 15px } .spec div { grid-template-columns: 1fr; gap: 2px } }
@media (max-width: 760px) { #doodles { display: none } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto } * { transition: none !important; animation: none !important } }
